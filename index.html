<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W14 中翻英複習</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Trebuchet MS", "Comic Sans MS", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 26%),
      radial-gradient(circle at top right, rgba(45, 212, 191, 0.14), transparent 24%),
      radial-gradient(circle at bottom right, rgba(251, 146, 60, 0.10), transparent 22%),
      linear-gradient(180deg, #f7fbff 0%, #f4fbff 52%, #f8fafc 100%);
    color: #243b53;
    font-size: 20px;
    line-height: 1.8;
    padding: 28px 18px 50px;
  }
  .container {
    max-width: 1040px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: #102a43;
    font-size: clamp(2.45rem, 5.4vw, 3.8rem);
    margin-bottom: 10px;
    letter-spacing: 0.03em;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.92);
  }
  .subtitle {
    text-align: center;
    color: #486581;
    margin: 0 auto 18px;
    font-size: 1.14em;
    font-weight: 800;
    letter-spacing: 0.08em;
    width: fit-content;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.88);
    border: 1px solid rgba(56, 189, 248, 0.18);
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
  }
  .subtitle::before { content: "📚 "; }
  .subtitle::after { content: " ✍️"; }
  .top-toolbar {
    display: flex;
    justify-content: center;
    margin-bottom: 26px;
  }
  section {
    position: relative;
    background: linear-gradient(180deg, #ffffff 0%, #f9fbfd 100%);
    border-radius: 30px;
    padding: 32px 32px 30px;
    margin-bottom: 34px;
    box-shadow: 0 18px 34px rgba(15, 23, 42, 0.08);
    border: 4px solid #dbe7f2;
    overflow: hidden;
  }
  .container > section:nth-of-type(1) {
    border-color: #cfe5ff;
    background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
  }
  .container > section:nth-of-type(2) {
    border-color: #cdeee7;
    background: linear-gradient(180deg, #ffffff 0%, #f5fffc 100%);
  }
  .container > section:nth-of-type(3) {
    border-color: #ffd9cf;
    background: linear-gradient(180deg, #ffffff 0%, #fff8f4 100%);
  }
  h2 {
    color: #102a43;
    padding: 16px 22px;
    border-radius: 20px;
    display: block;
    width: 100%;
    font-size: clamp(1.72rem, 3.4vw, 2.5rem);
    line-height: 1.35;
    margin-bottom: 16px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.10);
    text-shadow: 0 1px 0 rgba(255,255,255,0.72);
  }
  .container > section:nth-of-type(1) > h2 {
    background: linear-gradient(135deg, #bae6fd, #38bdf8);
  }
  .container > section:nth-of-type(2) > h2 {
    background: linear-gradient(135deg, #ccfbf1, #2dd4bf);
  }
  .container > section:nth-of-type(3) > h2 {
    background: linear-gradient(135deg, #fed7aa, #fb923c);
  }
  .container > section:nth-of-type(1) > h2::before { content: "👀 "; }
  .container > section:nth-of-type(2) > h2::before { content: "🧩 "; }
  .container > section:nth-of-type(3) > h2::before { content: "🌈 "; }
  .section-note {
    color: #627d98;
    font-size: 1.02em;
    margin-bottom: 14px;
    padding-left: 4px;
  }
  .section-note .em-red {
    color: #d62839;
    font-weight: 900;
  }
  .practice-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  .answer-toggle {
    border: 2px solid #14b8a6;
    background: linear-gradient(180deg, #ffffff 0%, #effcfb 100%);
    color: #0f766e;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.96em;
    font-weight: 800;
    line-height: 1.2;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    box-shadow: 0 6px 14px rgba(20, 184, 166, 0.12);
  }
  .answer-toggle:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(20, 184, 166, 0.18);
  }
  .answer-toggle:focus-visible {
    outline: 3px solid rgba(20, 184, 166, 0.22);
    outline-offset: 2px;
  }
  .examples {
    background: #fbfdff;
    border-left: 5px solid #38bdf8;

    padding: 14px 18px;
    margin: 12px 0;
    box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.12);

  .container > section:nth-of-type(2) .examples {

    box-shadow: inset 0 0 0 1px rgba(45, 212, 191, 0.12);
  }
  .container > section:nth-of-type(3) .examples {
    border-left-color: #fb923c;
    box-shadow: inset 0 0 0 1px rgba(251, 146, 60, 0.12);
  }
  .review-list {
    list-style: none;
    display: grid;
    gap: 16px;
  }
  .review-item {
    padding-bottom: 12px;
    border-bottom: 1px dashed #d9e2ec;
  }
  .review-item:last-child {
    padding-bottom: 0;
    border-bottom: none;
  }
  .review-pairs {
    display: grid;
    gap: 10px;
  }
  .toggle-example-item {
    padding: 8px 0;
  }
  .toggle-example-item .example-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 112px;
    gap: 10px 12px;
    align-items: start;
  }
  .toggle-example-item .zh {
    color: #334e68;
    font-size: 1.08em;
    line-height: 1.6;
    display: block;
    margin-left: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .grammar-keyword {
    color: #0ea5e9;
    font-weight: 900;
  }
  .toggle-example-item .sentence-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 112px;
    min-width: 112px;
    max-width: 112px;
    min-height: 42px;
    margin-bottom: 0;
    padding: 6px 12px;
    font-size: 0.82em;
    white-space: normal;
    text-align: center;
    box-shadow: 0 4px 10px rgba(85, 103, 216, 0.10);
  }
  .toggle-example-item .example-en {
    display: none;
    color: #0f4c81;
    font-weight: 700;
    font-size: 1.08em;
    line-height: 1.65;
    margin-top: 8px;
    margin-left: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .toggle-example-item.is-visible .example-en {
    display: block;
  }
  .third-s {
    color: #d62839;
    font-weight: 900;
  }
  @media (max-width: 900px) {
    body {
      font-size: 21px;
      padding: 20px 12px 40px;
    }
    h1 {
      font-size: clamp(2.25rem, 6vw, 3.25rem);
    }
    .subtitle {
      font-size: 1.08em;
    }
    section {
      padding: 24px 18px 22px;
      margin-bottom: 24px;
      border-radius: 24px;
    }
    h2 {
      font-size: clamp(1.95rem, 4vw, 2.7rem);
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 14px;
    }
    .section-note {
      font-size: 1.08em;
    }
    .examples {
      padding: 12px 14px;
    }
    .answer-toggle {
      font-size: 0.98em;
    }
    .toggle-example-item .zh,
    .toggle-example-item .example-en {

  }
  @media (max-width: 720px) {

    }

    }

      font-size: clamp(1.9rem, 6.2vw, 2.5rem);

    }

      font-size: 1.08em;
    }
    .top-toolbar {
      margin-bottom: 20px;
    }
    .practice-toolbar {
      margin-bottom: 10px;
    }
    .answer-toggle {
      width: 100%;
      justify-content: center;
      padding: 10px 12px;
      font-size: 1em;
      display: inline-flex;
    }
    .toggle-example-item .example-head {
      grid-template-columns: 1fr;
    }
    .toggle-example-item .sentence-toggle {
      width: 112px;
      min-width: 112px;
      max-width: 112px;
      justify-self: end;
    }
    .toggle-example-item .zh,
    .toggle-example-item .example-en {
      font-size: 1.14em;
      line-height: 1.72;
    }
  }
</style>
</head>

          pairs: [

            { zh: "她的貓摸起來毛茸茸又柔軟。", en: "Her cat feels furry and soft." }
          ]
        },
        {

          pairs: [
            { zh: "它吃起來是什麼味道？它是甜的、鹹的，還是辣的？", en: "What does it taste like? Is it sweet, salty, or spicy?" },
            { zh: "它吃起來鹹鹹的，而且很好吃。", en: "It tastes salty and yummy." }
          ]
        },
        {
          label: "10",
          pairs: [
            { zh: "食物拿在手上感覺如何？它是熱的、冷的、軟的，還是脆脆的？", en: "How does the food feel in your hands? Is it hot, cold, soft, or crunchy?" },
            { zh: "它拿在我手上感覺熱熱的、軟軟的。", en: "It feels hot and soft in my hands." }
          ]
        },

            { zh: "我吃它的時候會聽到脆脆的聲音。", en: "I hear a crunchy sound when I eat it." }
          ]
        },
        {
          label: "12",
          pairs: [
            { zh: "當它在煮的時候，或你吃它的時候，它聞起來是什麼味道？", en: "What does it smell like when it’s cooking or when you eat it?" },
            { zh: "它聞起來很香，有起司味。", en: "It smells good and cheesy." }
          ]
        },
        {
          label: "13",
          pairs: [
            { zh: "你的食物看起來像什麼？它有什麼顏色和形狀？", en: "What does your food look like? What colors and shapes does it have?" },
            { zh: "我的食物看起來圓圓的，而且很多顏色。它有紅色、黃色和白色。", en: "My food looks round and colorful. It has red, yellow, and white colors." }
          ]
        }
      ]
    }
  ];

  const root = document.getElementById("sectionsRoot");
  const globalToggle = document.getElementById("globalToggle");

  const highlightThirdPersonS = (text) => {
    const targets = [
      { word: "tastes", suffixLength: 1 },
      { word: "looks", suffixLength: 1 },
      { word: "feels", suffixLength: 1 },
      { word: "smells", suffixLength: 1 },
      { word: "has", suffixLength: 1 },
      { word: "likes", suffixLength: 1 },
      { word: "carries", suffixLength: 1 },
      { word: "drinks", suffixLength: 1 },
      { word: "eats", suffixLength: 1 }
    ];
    return targets.reduce((result, target) => {
      const pattern = new RegExp(`\\b${target.word}\\b`, "gi");
      return result.replace(pattern, (match) => `${match.slice(0, -target.suffixLength)}<span class="third-s">${match.slice(-target.suffixLength)}</span>`);
    }, text);
  };

  const highlightGrammarKeyword = (text) => {
    return text.replace(/（([^）]+)）/g, "（<span class=\"grammar-keyword\">$1</span>）");
  };

  const setInlineItemState = (item, shown) => {
    item.classList.toggle("is-visible", shown);
    item.dataset.visible = shown ? "true" : "false";
    const button = item.querySelector("[data-inline-toggle]");
    if (!button) return;
    const showLabel = button.dataset.showLabel || "顯示英文";
    const hideLabel = button.dataset.hideLabel || "隱藏英文";
    button.textContent = shown ? hideLabel : showLabel;
    button.setAttribute("aria-pressed", String(shown));
  };

  const syncInlineGroup = (group) => {
    if (!group) return;
    const button = group.querySelector("[data-inline-toggle-all]");
    if (!button) return;
    const items = Array.from(group.querySelectorAll(".toggle-example-item"));
    const allShown = items.length > 0 && items.every((item) => item.classList.contains("is-visible"));
    const showLabel = button.dataset.showLabel || "顯示本區英文";
    const hideLabel = button.dataset.hideLabel || "隱藏本區英文";
    button.textContent = allShown ? hideLabel : showLabel;
    button.setAttribute("aria-pressed", String(allShown));
  };

  const syncGlobalToggle = () => {
    const items = Array.from(document.querySelectorAll(".toggle-example-item"));
    const allShown = items.length > 0 && items.every((item) => item.classList.contains("is-visible"));
    const showLabel = globalToggle.dataset.showLabel || "顯示全部英文";
    const hideLabel = globalToggle.dataset.hideLabel || "隱藏全部英文";
    globalToggle.textContent = allShown ? hideLabel : showLabel;
    globalToggle.setAttribute("aria-pressed", String(allShown));
  };

  function buildSection(sectionData) {
    const section = document.createElement("section");
    section.setAttribute("data-inline-group", "");

    const h2 = document.createElement("h2");
    h2.textContent = sectionData.title;
    section.append(h2);

    const note = document.createElement("p");
    note.className = "section-note";
    note.innerHTML = sectionData.note;
    section.append(note);

    const toolbar = document.createElement("div");
    toolbar.className = "practice-toolbar";

    const sectionToggle = document.createElement("button");
    sectionToggle.type = "button";
    sectionToggle.className = "answer-toggle";
    sectionToggle.dataset.inlineToggleAll = "";
    sectionToggle.dataset.showLabel = "顯示本區英文";
    sectionToggle.dataset.hideLabel = "隱藏本區英文";
    sectionToggle.setAttribute("aria-pressed", "false");
    sectionToggle.textContent = "顯示本區英文";
    sectionToggle.addEventListener("click", () => {
      const items = Array.from(section.querySelectorAll(".toggle-example-item"));
      const shouldShowAll = !items.every((item) => item.classList.contains("is-visible"));
      items.forEach((item) => setInlineItemState(item, shouldShowAll));
      syncInlineGroup(section);
      syncGlobalToggle();
    });
    toolbar.append(sectionToggle);
    section.append(toolbar);

    const examples = document.createElement("div");
    examples.className = "examples";

    const list = document.createElement("ol");
    list.className = "review-list";

    sectionData.items.forEach((itemData) => {
      const item = document.createElement("li");
      item.className = "review-item";

      const pairs = document.createElement("div");
      pairs.className = "review-pairs";

      itemData.pairs.forEach((pair, pairIndex) => {
        const pairItem = document.createElement("div");
        pairItem.className = "toggle-example-item";
        pairItem.dataset.visible = "false";

        const pairHead = document.createElement("div");
        pairHead.className = "example-head";

        const zh = document.createElement("span");
        zh.className = "zh";
        const prefix = pairIndex === 0 ? `${itemData.label}. ` : "";
        zh.innerHTML = highlightGrammarKeyword(`${prefix}${pair.zh}`);

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "answer-toggle sentence-toggle";
        toggle.dataset.inlineToggle = "";
        toggle.dataset.showLabel = "顯示英文";
        toggle.dataset.hideLabel = "隱藏英文";
        toggle.setAttribute("aria-pressed", "false");
        toggle.textContent = "顯示英文";
        toggle.addEventListener("click", () => {
          const shown = !pairItem.classList.contains("is-visible");
          setInlineItemState(pairItem, shown);
          syncInlineGroup(section);
          syncGlobalToggle();
        });

        const en = document.createElement("span");
        en.className = "example-en";
        en.innerHTML = highlightThirdPersonS(pair.en);

        pairHead.append(zh, toggle);
        pairItem.append(pairHead, en);
        pairs.append(pairItem);
      });

      item.append(pairs);
      list.append(item);
    });

    examples.append(list);
    section.append(examples);
    root.append(section);
    syncInlineGroup(section);
  }

  reviewSections.forEach(buildSection);

  globalToggle.addEventListener("click", () => {
    const items = Array.from(document.querySelectorAll(".toggle-example-item"));
    const shouldShowAll = !items.every((item) => item.classList.contains("is-visible"));
    items.forEach((item) => setInlineItemState(item, shouldShowAll));
    document.querySelectorAll("[data-inline-group]").forEach((group) => {
      syncInlineGroup(group);
    });
    syncGlobalToggle();
  });

  syncGlobalToggle();
</script>
</body>
</html>
