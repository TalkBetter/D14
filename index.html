could	可以
like	喜歡
love	愛
want	想要
would	會／將會
smell	聞／氣味
nose	鼻子
sugar	糖
spicy	辣的
taste	味道／品嚐
thirsty	口渴的
tongue	舌頭
sour	酸的
sweet	甜的
crunchy	酥脆的
Week 12

many	許多的
more	更多的
other	其他的
together	一起
which	哪個
touch	觸摸／碰觸
fingers	手指
soft	柔軟的
hard	堅硬的
rough	粗糙的
bumpy	崎嶇的
furry	毛茸茸的
fluffy	蓬鬆的
sticky	黏的
slimy	黏滑的`;

  const vocabularyGroups = vocabularySource
    .trim()
    .split(/\n(?=Week \d+\n)/)
    .map((block) => {
      const lines = block.split("\n").filter(Boolean);
      const week = lines.shift();
      const words = lines.map((line) => {
        const [en, zh] = line.split(/\t+/);
        return { en, zh };
      });
      return { week, words };
    });

  const root = document.getElementById("sectionsRoot");
  const globalToggle = document.getElementById("globalToggle");
  let currentVocabButton = null;
  let vocabSpeechSession = 0;

  const highlightThirdPersonS = (text) => {
    const targets = [
      { word: "tastes", suffixLength: 1 },
      { word: "looks", suffixLength: 1 },
      { word: "feels", suffixLength: 1 },
      { word: "smells", suffixLength: 1 },
      { word: "has", suffixLength: 1 },
      { word: "likes", suffixLength: 1 },
      { word: "carries", suffixLength: 1 },
      { word: "drinks", suffixLength: 1 },
      { word: "eats", suffixLength: 1 }
    ];
    const withThirdPersonHighlight = targets.reduce((result, target) => {
      const pattern = new RegExp(`\\b${target.word}\\b`, "gi");
      return result.replace(pattern, (match) => `${match.slice(0, -target.suffixLength)}<span class="third-s">${match.slice(-target.suffixLength)}</span>`);
    }, text);
    return withThirdPersonHighlight.replace(/\b(ate|went|drank)\b/gi, "<span class=\"third-s\">$1</span>");
  };

  const highlightGrammarKeyword = (text) => {
    return text.replace(/（([^）]+)）/g, "（<span class=\"grammar-keyword\">$1</span>）");
  };

  const setInlineItemState = (item, shown) => {
    item.classList.toggle("is-visible", shown);
    item.dataset.visible = shown ? "true" : "false";
    const button = item.querySelector("[data-inline-toggle]");
    if (!button) return;
    const showLabel = button.dataset.showLabel || "顯示英文";
    const hideLabel = button.dataset.hideLabel || "隱藏英文";
    button.textContent = shown ? hideLabel : showLabel;
    button.setAttribute("aria-pressed", String(shown));
  };

  const syncInlineGroup = (group) => {
    if (!group) return;
    const button = group.querySelector("[data-inline-toggle-all]");
    if (!button) return;
    const items = Array.from(group.querySelectorAll(".toggle-example-item"));
    const allShown = items.length > 0 && items.every((item) => item.classList.contains("is-visible"));
    const showLabel = button.dataset.showLabel || "顯示本區英文";
    const hideLabel = button.dataset.hideLabel || "隱藏本區英文";
    button.textContent = allShown ? hideLabel : showLabel;
    button.setAttribute("aria-pressed", String(allShown));
  };

  const syncGlobalToggle = () => {
    const items = Array.from(document.querySelectorAll(".toggle-example-item"));
    const allShown = items.length > 0 && items.every((item) => item.classList.contains("is-visible"));
    const showLabel = globalToggle.dataset.showLabel || "顯示全部英文";
    const hideLabel = globalToggle.dataset.hideLabel || "隱藏全部英文";
    globalToggle.textContent = allShown ? hideLabel : showLabel;
    globalToggle.setAttribute("aria-pressed", String(allShown));
  };

  const createSectionToggle = (section) => {
    const sectionToggle = document.createElement("button");
    sectionToggle.type = "button";
    sectionToggle.className = "answer-toggle";
    sectionToggle.dataset.inlineToggleAll = "";
    sectionToggle.dataset.showLabel = "顯示本區英文";
    sectionToggle.dataset.hideLabel = "隱藏本區英文";
    sectionToggle.setAttribute("aria-pressed", "false");
    sectionToggle.textContent = "顯示本區英文";
    sectionToggle.addEventListener("click", () => {
      const items = Array.from(section.querySelectorAll(".toggle-example-item"));
      const shouldShowAll = !items.every((item) => item.classList.contains("is-visible"));
      items.forEach((item) => setInlineItemState(item, shouldShowAll));
      syncInlineGroup(section);
      syncGlobalToggle();
    });
    return sectionToggle;
  };

  function buildSection(sectionData) {
    const section = document.createElement("section");
    section.setAttribute("data-inline-group", "");

    const h2 = document.createElement("h2");
    h2.textContent = sectionData.title;
    section.append(h2);

    const note = document.createElement("p");
    note.className = "section-note";
    note.innerHTML = sectionData.note;
    section.append(note);

    const toolbar = document.createElement("div");
    toolbar.className = "practice-toolbar";
    toolbar.append(createSectionToggle(section));
    section.append(toolbar);

    const examples = document.createElement("div");
    examples.className = "examples";

    const list = document.createElement("ol");
    list.className = "review-list";

    sectionData.items.forEach((itemData) => {
      const item = document.createElement("li");
      item.className = "review-item";

      const pairs = document.createElement("div");
      pairs.className = "review-pairs";

      itemData.pairs.forEach((pair, pairIndex) => {
        const pairItem = document.createElement("div");
        pairItem.className = "toggle-example-item";
        pairItem.dataset.visible = "false";

        const pairHead = document.createElement("div");
        pairHead.className = "example-head";

        const zh = document.createElement("span");
        zh.className = "zh";
        const prefix = pairIndex === 0 ? `${itemData.label}. ` : "";
        zh.innerHTML = highlightGrammarKeyword(`${prefix}${pair.zh}`);

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "answer-toggle sentence-toggle";
        toggle.dataset.inlineToggle = "";
        toggle.dataset.showLabel = "顯示英文";
        toggle.dataset.hideLabel = "隱藏英文";
        toggle.setAttribute("aria-pressed", "false");
        toggle.textContent = "顯示英文";
        toggle.addEventListener("click", () => {
          const shown = !pairItem.classList.contains("is-visible");
          setInlineItemState(pairItem, shown);
          syncInlineGroup(section);
          syncGlobalToggle();
        });

        const en = document.createElement("span");
        en.className = "example-en";
        en.innerHTML = highlightThirdPersonS(pair.en);

        pairHead.append(zh, toggle);
        pairItem.append(pairHead, en);
        pairs.append(pairItem);
      });

      item.append(pairs);
      list.append(item);
    });

    examples.append(list);
    section.append(examples);
    root.append(section);
    syncInlineGroup(section);
  }

  function buildVocabularySection(sectionData) {
    const section = document.createElement("section");

    const h2 = document.createElement("h2");
    h2.textContent = sectionData.title;
    section.append(h2);

    if (sectionData.note) {
      const note = document.createElement("p");
      note.className = "section-note";
      note.textContent = sectionData.note;
      section.append(note);
    }

    const examples = document.createElement("div");
    examples.className = "examples";

    const weeks = document.createElement("div");
    weeks.className = "vocab-weeks";

    sectionData.groups.forEach((group) => {
      const week = document.createElement("div");
      week.className = "vocab-week";

      const title = document.createElement("h3");
      title.className = "vocab-week-title";
      title.textContent = group.week;
      week.append(title);

      const list = document.createElement("ol");
      list.className = "vocab-list";

      group.words.forEach((word, index) => {
        const item = document.createElement("li");
        item.className = "vocab-item";

        const play = document.createElement("button");
        play.type = "button";
        play.className = "vocab-play";
        play.dataset.vocabWord = word.en;
        play.dataset.state = "ready";
        play.setAttribute("aria-label", `播放 ${word.en}`);
        play.title = `播放 ${word.en}`;
        play.textContent = "▶";
        play.addEventListener("click", () => toggleVocabularyWord(word.en, play));

        const en = document.createElement("span");
        en.className = "vocab-en";
        en.textContent = word.en;

        const zh = document.createElement("span");
        zh.className = "vocab-zh";
        zh.textContent = `${index + 1}. ${word.zh}`;

        item.append(en, play, zh);
        list.append(item);
      });

      week.append(list);
      weeks.append(week);
    });

    examples.append(weeks);
    section.append(examples);
    root.append(section);
  }

  function resetVocabularyButtons() {
    document.querySelectorAll(".vocab-play").forEach((button) => {
      button.dataset.state = "ready";
      button.textContent = "▶";
      button.setAttribute("aria-pressed", "false");
    });
  }

  function stopVocabularySpeech() {
    vocabSpeechSession += 1;
    currentVocabButton = null;
    resetVocabularyButtons();

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  }

  function toggleVocabularyWord(word, button) {
    if (!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance !== "function") {
      button.disabled = true;
      button.title = "這個瀏覽器不支援朗讀";
      button.setAttribute("aria-label", `${word} 無法朗讀`);
      return;
    }

    if (currentVocabButton === button) {
      stopVocabularySpeech();
      return;
    }

    stopVocabularySpeech();

    const sessionId = vocabSpeechSession;
    currentVocabButton = button;
    button.dataset.state = "playing";
    button.textContent = "■";
    button.setAttribute("aria-pressed", "true");

    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = "en-US";
    utterance.rate = 0.82;
    utterance.pitch = 1;
    utterance.onend = () => {
      if (currentVocabButton !== button || vocabSpeechSession !== sessionId) return;
      currentVocabButton = null;
      resetVocabularyButtons();
    };
    utterance.onerror = () => {
      if (currentVocabButton !== button || vocabSpeechSession !== sessionId) return;
      currentVocabButton = null;
      resetVocabularyButtons();
    };

    window.speechSynthesis.speak(utterance);
  }

  reviewSections.forEach(buildSection);
  buildVocabularySection({
    title: "Part 4 ｜ A冠王單字複習",
    note: "",
    groups: vocabularyGroups
  });

  globalToggle.addEventListener("click", () => {
    const items = Array.from(document.querySelectorAll(".toggle-example-item"));
    const shouldShowAll = !items.every((item) => item.classList.contains("is-visible"));
    items.forEach((item) => setInlineItemState(item, shouldShowAll));
    document.querySelectorAll("[data-inline-group]").forEach((group) => {
      syncInlineGroup(group);
    });
    syncGlobalToggle();
  });

  syncGlobalToggle();
</script>
</body>
